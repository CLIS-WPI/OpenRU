[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openru-x6"
version = "0.1.0"
description = "OpenRU-X6 digital-twin / GPU simulation lab for a 64T64R hybrid massive-MIMO research radio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenRU-X6 Simulation Lab" }]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "pytest>=8.0",
  "hypothesis>=6.100",
  "psutil>=5.9",
  "jinja2>=3.1",
]

[project.optional-dependencies]
gpu = ["torch>=2.9", "sionna==2.2.0", "nvidia-ml-py>=12"]
dev = ["pytest-cov>=5", "pytest-xdist>=3", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
openru-x6 = "openru_x6.cli:main"

[tool.setuptools.packages.find]
include = ["openru_x6*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: requires CUDA",
  "slow: long-running",
  "scenario: executes a full experiment",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
