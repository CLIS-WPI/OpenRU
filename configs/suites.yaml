schema_version: "1.0"
smoke:
  seeds: 2
  seed_base: 100
  notes: "2 seeds per basic scenario; fast validation"
  e01:
    chain_modes: [8, 64]
    ue_counts: [16, 128]
    slots: 3
    precoders: ["mf", "zf", "rzf"]
  e02:
    loads: [0.0, 0.05, 0.1, 0.25, 1.0]
    policies: ["static", "threshold", "predictive"]
    slots: 120
    users: 48
    mean_arrival_mbps: 20.0
  e03:
    scenarios: ["baseline", "mobility", "csi_delay", "phase_error"]
    slots: 10
    users: 24
  e04:
    faults: ["pa_gain_loss", "tile_dead", "phase_drift", "fan_failure"]
    policies: ["none", "threshold", "proposed"]
    seeds_cal: [900, 901]
    slots: 40
    users: 24
  e05:
    command_trials: 5
  e06:
    budgets: [0.01, 0.05]
    policies: ["comm_only", "periodic", "adaptive"]
    slots: 120
  e07:
    scenarios: ["blocked_near", "blocked_far"]
    modes: ["off", "random", "practical", "oracle"]
    slots: 5
  e08:
    conditions: ["baseline", "loss_5pct", "sync_loss", "combined"]
    slots: 20
  e09:
    matmul_sizes: [1024, 4096]
    sensitivities: ["low", "base", "high"]
    ue_counts: [64, 512]
  e10:
    timeout_s: 45
  integration:
    seeds: 5
    seed_base: 500
    slots: 60
    users: 16

