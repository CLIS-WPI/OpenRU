# OCUDU gNB configuration used only for local DU/PHY test-mode evidence.
# ru_dummy + test_mode exercise scheduler/MAC/PHY without RF hardware or a core network.
# This is NOT Open Fronthaul interoperability and NOT a hardware measurement.
cu_cp:
  amf:
    addrs: 127.0.0.1
    port: 38412
    bind_addrs: 127.0.0.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
ru_dummy:
  dl_processing_delay: 1
  time_scaling: 1
cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 7
test_mode:
  test_ue:
    rnti: 0x44
    ri: 1
    cqi: 15
    nof_ues: 1
    pusch_active: true
    pdsch_active: true
log:
  filename: /tmp/gnb.log
  all_level: debug
